        // Functions
        function showLoading(show = true) {
            loading.classList.toggle('hidden', !show);
            loading.classList.toggle('flex', show);
        }

        function showModal(show = true) {
            routeModal.classList.toggle('hidden', !show);
            routeModal.classList.toggle('flex', show);
        }

        function clearForm() {
            routeForm.reset();
            editingRouteId = null;
        }

        function formatRouteInfo(route) {
            const montagemText = {
                'sim': 'Faz montagem',
                'nao': 'Não faz montagem',
                'sede': 'Montagem somente na sede'
            };
            
            const invernoText = {
                'sim': 'Entrega no inverno',
                'nao': 'Não entrega no inverno'
            };

            return `
                <div class="bg-white rounded-xl p-6 border-l-4 border-zenir-blue shadow-lg hover:shadow-xl transition-shadow duration-200">
                    <h4 class="font-bold text-xl text-zenir-dark mb-4">${route.localidade}</h4>
                    <div class="space-y-3">
                        <div class="flex items-center">
                            <div class="bg-zenir-blue bg-opacity-10 rounded-lg p-2 mr-3">
                                <i class="fas fa-calendar-day text-zenir-blue"></i>
                            </div>
                            <div>
                                <span class="text-sm font-medium text-zenir-gray">Dia da Semana</span>
                                <p class="font-semibold text-zenir-dark">${route.diaSemana}</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <div class="bg-zenir-blue bg-opacity-10 rounded-lg p-2 mr-3">
                                <i class="fas fa-tools text-zenir-blue"></i>
                            </div>
                            <div>
                                <span class="text-sm font-medium text-zenir-gray">Montagem</span>
                                <p class="font-semibold text-zenir-dark">${montagemText[route.montagem]}</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <div class="bg-zenir-blue bg-opacity-10 rounded-lg p-2 mr-3">
                                <i class="fas fa-snowflake text-zenir-blue"></i>
                            </div>
                            <div>
                                <span class="text-sm font-medium text-zenir-gray">Entrega no Inverno</span>
                                <p class="font-semibold text-zenir-dark">${invernoText[route.inverno]}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6 pt-4 border-t border-gray-100">
                        <button onclick="editRoute('${route.id}')" class="flex-1 bg-zenir-blue hover:bg-zenir-dark text-white py-2 px-4 rounded-lg font-semibold transition-all duration-200 transform hover:scale-105 shadow-md">
                            <i class="fas fa-edit mr-2"></i>Editar
                        </button>
                        <button onclick="deleteRoute('${route.id}')" class="flex-1 bg-zenir-red hover:bg-red-600 text-white py-2 px-4 rounded-lg font-semibold transition-all duration-200 transform hover:scale-105 shadow-md">
                            <i class="fas fa-trash mr-2"></i>Excluir
                        </button>
                    </div>
                </div>
            `;
        }

        async function loadRoutes() {
            try {
                showLoading(true);
                const querySnapshot = await getDocs(collection(db, "rotas"));
                allRoutes = [];
                
                querySnapshot.forEach((routeDoc) => {
                    const routeData = routeDoc.data();
                    if (routeData._deleted === true) {
                        return;
                    }

                    allRoutes.push({
                        id: routeDoc.id,
                        ...routeData,
                        diaSemana: routeData._displayDiaSemana || routeData.diaSemana
                    });
                });

                if (allRoutes.length === 0) {
                    await populateInitialData();
                }
            } catch (error) {
                console.error("Erro ao carregar rotas:", error);
                alert("Erro ao carregar as rotas. Tente novamente.");
            } finally {
                showLoading(false);
            }
        }

        async function populateInitialData() {
            try {
                console.log("Populando dados iniciais...");
                const batch = [];
                
                for (const route of initialRoutes) {
                    batch.push(addRouteDocument(route));
                }
                
                await Promise.all(batch);
                console.log("Dados iniciais adicionados com sucesso!");
                await loadRoutes();
            } catch (error) {
                console.error("Erro ao popular dados iniciais:", error);
                alert("Erro ao inicializar o sistema. Tente recarregar a página.");
            }
        }

        function displayAllRoutes() {
            const routesByDay = {
                'Segunda-feira': [],
                'Terça-feira': [],
                'Quarta-feira': [],
                'Quinta-feira': [],
                'Sexta-feira': [],
                'Sábado': []
            };

            allRoutes.forEach(route => {
                if (routesByDay[route.diaSemana]) {
                    routesByDay[route.diaSemana].push(route);
                }
            });

            let html = '';
            Object.keys(routesByDay).forEach(day => {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-bold text-primary mb-3 border-b border-gray-200 pb-2">
                            <i class="fas fa-calendar mr-2"></i>${day}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${routesByDay[day].map(route => formatRouteInfo(route)).join('')}
                        </div>
                    </div>
                `;
            });

            allRoutesDiv.innerHTML = html;
        }

        // Função para normalizar texto - remove apenas acentos e cedilhas
        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize('NFD') // Decompõe caracteres acentuados
                .replace(/[\u0300-\u036f]/g, '') // Remove os diacríticos (acentos)
                .replace(/[çÇ]/g, 'c'); // Substitui ç por c
        }

        function searchRoutes() {
            const searchTerm = searchInput.value.trim();
            
            if (!searchTerm) {
                alert('Por favor, digite o nome de uma localidade para pesquisar.');
                return;
            }

            // Normaliza o termo de busca e a localidade para comparação
            const normalizedSearchTerm = normalizeText(searchTerm);

            const filteredRoutes = allRoutes.filter(route => {
                const normalizedLocalidade = normalizeText(route.localidade);
                return normalizedLocalidade.includes(normalizedSearchTerm);
            });

            if (filteredRoutes.length > 0) {
                const html = filteredRoutes.map(route => formatRouteInfo(route)).join('');
                searchResults.innerHTML = html;
            } else {
                searchResults.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-search text-gray-400 text-4xl mb-4"></i>
                        <p class="text-gray-600 text-lg">Nenhuma localidade encontrada para "${searchTerm}"</p>
                        <p class="text-gray-500 text-sm mt-2">Tente usar termos diferentes ou verifique a ortografia.</p>
                    </div>
                `;
            }
            
            // Mostrar modal com resultados
            searchResultsModal.classList.remove('hidden');
            searchResultsModal.classList.add('flex');
        }

        function getStoredRouteData(routeData) {
            return {
                localidade: routeData.localidade,
                diaSemana: routeData.diaSemana === 'Sábado' ? 'Sexta-feira' : routeData.diaSemana,
                montagem: routeData.montagem,
                inverno: routeData.inverno
            };
        }

        async function addRouteDocument(routeData) {
            const newRouteRef = await addDoc(collection(db, "rotas"), getStoredRouteData(routeData));

            if (routeData.diaSemana === 'Sábado') {
                try {
                    await updateDoc(newRouteRef, { _displayDiaSemana: 'Sábado' });
                } catch (error) {
                    await updateDoc(newRouteRef, { _deleted: true });
                    throw error;
                }
            }

            return newRouteRef;
        }

        async function saveRoute(routeData) {
            try {
                showLoading(true);
                
                if (editingRouteId) {
                    await updateDoc(doc(db, "rotas", editingRouteId), {
                        ...getStoredRouteData(routeData),
                        _displayDiaSemana: routeData.diaSemana === 'Sábado' ? 'Sábado' : null
                    });
                    console.log("Rota atualizada com sucesso!");
                } else {
                    await addRouteDocument(routeData);
                    console.log("Rota adicionada com sucesso!");
                }
                
                await loadRoutes();

                if (!searchResultsModal.classList.contains('hidden')) {
                    searchRoutes();
                }

                showModal(false);
                clearForm();
            } catch (error) {
                console.error("Erro ao salvar rota:", error);
                alert("Erro ao salvar a rota. Tente novamente.");
            } finally {
                showLoading(false);
            }
        }

        window.editRoute = function(routeId) {
            const route = allRoutes.find(r => r.id === routeId);
            if (route) {
                editingRouteId = routeId;
                document.getElementById('localidade').value = route.localidade;
                document.getElementById('diaSemana').value = route.diaSemana;
                document.getElementById('montagem').value = route.montagem;
                document.getElementById('inverno').value = route.inverno;
                modalTitle.textContent = 'Editar Rota';
                showModal(true);
            }
        };

        // Função para mostrar modal de confirmação de exclusão
        function showDeleteModal(show = true) {
            deleteModal.classList.toggle('hidden', !show);
            deleteModal.classList.toggle('flex', show);
        }

        // Função chamada quando o botão de excluir é clicado
        window.deleteRoute = function(routeId) {
            const route = allRoutes.find(r => r.id === routeId);
            if (route) {
                routeToDelete = routeId;
                deleteLocalidade.textContent = route.localidade;
                showDeleteModal(true);
            }
        };

        // Função para confirmar a exclusão
        async function confirmDeleteRoute() {
            if (routeToDelete) {
                try {
                    showLoading(true);
                    showDeleteModal(false);
                    
                    await updateDoc(doc(db, "rotas", routeToDelete), { _deleted: true });
                    console.log("Rota excluída com sucesso!");
                    
                    // Recarrega as rotas e atualiza a busca se houver resultados sendo exibidos
                    await loadRoutes();
                    
                    // Se o modal de busca estiver aberto, atualiza os resultados
                    if (!searchResultsModal.classList.contains('hidden')) {
                        searchRoutes();
                    }
                    
                    routeToDelete = null;
                } catch (error) {
                    console.error("Erro ao excluir rota:", error);
                    alert("Erro ao excluir a rota. Tente novamente.");
                } finally {
                    showLoading(false);
                }
            }
        }

        // Função para ajustar a tela quando o teclado aparecer (apenas para campo de busca)
        function adjustSearchFieldForKeyboard() {
            // Scroll suave para posicionar o campo de busca no topo
            const searchSection = document.querySelector('.container .bg-white');
            if (searchSection) {
                searchSection.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start',
                    inline: 'nearest'
                });
            }
        }

        // Event listeners
        searchBtn.addEventListener('click', searchRoutes);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchRoutes();
            }
        });

        // Ajuste automático apenas quando o campo de busca ganha foco
        searchInput.addEventListener('focus', () => {
            // Delay pequeno para dispositivos móveis
            setTimeout(adjustSearchFieldForKeyboard, 300);
        });

        // Close search results modal
        closeSearchModal.addEventListener('click', () => {
            searchResultsModal.classList.add('hidden');
            searchResultsModal.classList.remove('flex');
        });

        // Close search modal when clicking outside
        searchResultsModal.addEventListener('click', (e) => {
            if (e.target === searchResultsModal) {
                searchResultsModal.classList.add('hidden');
                searchResultsModal.classList.remove('flex');
            }
        });

        addRouteBtn.addEventListener('click', () => {
            clearForm();
            modalTitle.textContent = 'Nova Rota';
            showModal(true);
        });

        closeModal.addEventListener('click', () => {
            showModal(false);
            clearForm();
        });

        cancelBtn.addEventListener('click', () => {
            showModal(false);
            clearForm();
        });

        routeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const routeData = {
                localidade: document.getElementById('localidade').value.trim(),
                diaSemana: document.getElementById('diaSemana').value,
                montagem: document.getElementById('montagem').value,
                inverno: document.getElementById('inverno').value
            };

            saveRoute(routeData);
        });

        // Close modal when clicking outside
        routeModal.addEventListener('click', (e) => {
            if (e.target === routeModal) {
                showModal(false);
                clearForm();
            }
        });

        // Event listeners para o modal de exclusão
        confirmDelete.addEventListener('click', confirmDeleteRoute);
        
        cancelDelete.addEventListener('click', () => {
            showDeleteModal(false);
            routeToDelete = null;
        });

        // Close delete modal when clicking outside
        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                showDeleteModal(false);
                routeToDelete = null;
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            loadRoutes();
        });

        // Handle dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
