<body class="bg-zenir-bg min-h-screen font-zenir">
    <!-- Header -->
    <header class="bg-gradient-to-r from-zenir-blue to-zenir-dark text-white shadow-xl">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white bg-opacity-10 rounded-lg p-2">
                        <i class="fas fa-route text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">Sistema de Rotas</h1>
                        <p class="text-blue-100 text-sm font-medium">Zenir Móveis - CDZ Sobral</p>
                    </div>
                </div>
                <button id="addRouteBtn" class="bg-zenir-red hover:bg-red-600 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-200 shadow-lg transform hover:scale-105">
                    <i class="fas fa-plus mr-2"></i>
                    Nova Rota
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Search Section -->
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-zenir-blue to-zenir-dark px-6 py-4">
                <h2 class="text-xl font-bold text-white flex items-center">
                    <i class="fas fa-search mr-3"></i>
                    Buscar Localidade
                </h2>
            </div>
            <div class="p-6">
                <div class="flex flex-col sm:flex-row gap-4">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Digite o nome da localidade..." 
                        class="flex-1 p-4 border-2 border-gray-200 rounded-lg focus:border-zenir-blue focus:ring-2 focus:ring-zenir-blue focus:ring-opacity-20 transition-all duration-200 text-base bg-gray-50 focus:bg-white"
                    >
                    <button id="searchBtn" class="bg-zenir-blue hover:bg-zenir-dark text-white px-8 py-4 rounded-lg font-semibold transition-all duration-200 shadow-md transform hover:scale-105">
                        <i class="fas fa-search mr-2"></i>
                        Buscar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Search Results -->
    <div id="searchResultsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl m-4 max-w-5xl w-full max-h-[90vh] overflow-hidden">
            <div class="bg-gradient-to-r from-zenir-blue to-zenir-dark px-6 py-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold text-white flex items-center">
                        <i class="fas fa-search mr-3"></i>
                        Resultados da Busca
                    </h3>
                    <button id="closeSearchModal" class="text-white hover:text-gray-200 text-xl transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="searchResults" class="p-6 overflow-y-auto max-h-[calc(90vh-80px)] space-y-6"></div>
        </div>
    </div>

    <!-- Modal for Add/Edit Route -->
    <div id="routeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl m-4 max-w-md w-full overflow-hidden">
            <div class="bg-gradient-to-r from-zenir-blue to-zenir-dark px-6 py-4">
                <div class="flex justify-between items-center">
                    <h3 id="modalTitle" class="text-xl font-bold text-white">Nova Rota</h3>
                    <button id="closeModal" class="text-white hover:text-gray-200 text-xl transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <form id="routeForm" class="p-6 space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-zenir-gray mb-2">Localidade</label>
                    <input type="text" id="localidade" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-zenir-blue focus:ring-2 focus:ring-zenir-blue focus:ring-opacity-20 transition-all duration-200 text-base bg-gray-50 focus:bg-white" required>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-zenir-gray mb-2">Dia da Semana</label>
                    <select id="diaSemana" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-zenir-blue focus:ring-2 focus:ring-zenir-blue focus:ring-opacity-20 transition-all duration-200 text-base bg-gray-50 focus:bg-white" required>
                        <option value="">Selecione...</option>
                        <option value="Segunda-feira">Segunda-feira</option>
                        <option value="Terça-feira">Terça-feira</option>
                        <option value="Quarta-feira">Quarta-feira</option>
                        <option value="Quinta-feira">Quinta-feira</option>
                        <option value="Sexta-feira">Sexta-feira</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-zenir-gray mb-2">Montagem</label>
                    <select id="montagem" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-zenir-blue focus:ring-2 focus:ring-zenir-blue focus:ring-opacity-20 transition-all duration-200 text-base bg-gray-50 focus:bg-white" required>
                        <option value="sim">Faz montagem</option>
                        <option value="nao">Não faz montagem</option>
                        <option value="sede">Montagem somente na sede</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-zenir-gray mb-2">Entrega no Inverno</label>
                    <select id="inverno" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-zenir-blue focus:ring-2 focus:ring-zenir-blue focus:ring-opacity-20 transition-all duration-200 text-base bg-gray-50 focus:bg-white" required>
                        <option value="sim">Entrega no inverno</option>
                        <option value="nao">Não entrega no inverno</option>
                    </select>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-zenir-blue hover:bg-zenir-dark text-white py-3 px-6 rounded-lg font-semibold transition-all duration-200 shadow-md transform hover:scale-105">
                        <i class="fas fa-save mr-2"></i>
                        Salvar
                    </button>
                    <button type="button" id="cancelBtn" class="flex-1 bg-zenir-gray hover:bg-gray-600 text-white py-3 px-6 rounded-lg font-semibold transition-all duration-200">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl m-4 max-w-md w-full overflow-hidden">
            <div class="bg-gradient-to-r from-zenir-red to-red-600 px-6 py-4">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle text-white text-2xl mr-3"></i>
                    <h3 class="text-xl font-bold text-white">Confirmar Exclusão</h3>
                </div>
            </div>
            
            <div class="p-6">
                <p class="text-zenir-gray mb-6 leading-relaxed">
                    Tem certeza que deseja excluir a rota para <strong id="deleteLocalidade" class="text-zenir-dark"></strong>?
                    <br><span class="text-sm text-zenir-red font-medium">Esta ação não pode ser desfeita.</span>
                </p>
                
                <div class="flex gap-3">
                    <button id="confirmDelete" class="flex-1 bg-zenir-red hover:bg-red-600 text-white py-3 px-6 rounded-lg font-semibold transition-all duration-200 shadow-md transform hover:scale-105">
                        <i class="fas fa-trash mr-2"></i>
                        Sim, Excluir
                    </button>
                    <button id="cancelDelete" class="flex-1 bg-zenir-gray hover:bg-gray-600 text-white py-3 px-6 rounded-lg font-semibold transition-all duration-200">
                        <i class="fas fa-times mr-2"></i>
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-8">
            <div class="flex items-center">
                <i class="fas fa-spinner fa-spin mr-4 text-zenir-blue text-2xl"></i>
                <span class="text-zenir-dark font-semibold text-lg">Carregando...</span>
            </div>
        </div>
    </div>

        async function loadRoutes() {
            try {
                showLoading(true);
                const querySnapshot = await getDocs(collection(db, "rotas"));
                allRoutes = [];
                
                querySnapshot.forEach((doc) => {
                    allRoutes.push({ id: doc.id, ...doc.data() });
                });

                if (allRoutes.length === 0) {
                    await populateInitialData();
                }
            } catch (error) {
                console.error("Erro ao carregar rotas:", error);
                alert("Erro ao carregar as rotas. Tente novamente.");
            } finally {
                showLoading(false);
            }
        }

        async function populateInitialData() {
            try {
                console.log("Populando dados iniciais...");
                const batch = [];
                
                for (const route of initialRoutes) {
                    batch.push(addDoc(collection(db, "rotas"), route));
                }
                
                await Promise.all(batch);
                console.log("Dados iniciais adicionados com sucesso!");
                await loadRoutes();
            } catch (error) {
                console.error("Erro ao popular dados iniciais:", error);
                alert("Erro ao inicializar o sistema. Tente recarregar a página.");
            }
        }

        function displayAllRoutes() {
            const routesByDay = {
                'Segunda-feira': [],
                'Terça-feira': [],
                'Quarta-feira': [],
                'Quinta-feira': [],
                'Sexta-feira': []
            };

            allRoutes.forEach(route => {
                if (routesByDay[route.diaSemana]) {
                    routesByDay[route.diaSemana].push(route);
                }
            });

            let html = '';
            Object.keys(routesByDay).forEach(day => {
                html += `
                    <div class="mb-6">
                        <h3 class="text-lg font-bold text-primary mb-3 border-b border-gray-200 pb-2">
                            <i class="fas fa-calendar mr-2"></i>${day}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${routesByDay[day].map(route => formatRouteInfo(route)).join('')}
                        </div>
                    </div>
                `;
            });

            allRoutesDiv.innerHTML = html;
        }

        // Função para normalizar texto - remove apenas acentos e cedilhas
        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize('NFD') // Decompõe caracteres acentuados
                .replace(/[\u0300-\u036f]/g, '') // Remove os diacríticos (acentos)
                .replace(/[çÇ]/g, 'c'); // Substitui ç por c
        }

        function searchRoutes() {
            const searchTerm = searchInput.value.trim();
            
            if (!searchTerm) {
                alert('Por favor, digite o nome de uma localidade para pesquisar.');
                return;
            }

            // Normaliza o termo de busca e a localidade para comparação
            const normalizedSearchTerm = normalizeText(searchTerm);

            const filteredRoutes = allRoutes.filter(route => {
                const normalizedLocalidade = normalizeText(route.localidade);
                return normalizedLocalidade.includes(normalizedSearchTerm);
            });

            if (filteredRoutes.length > 0) {
                const html = filteredRoutes.map(route => formatRouteInfo(route)).join('');
                searchResults.innerHTML = html;
            } else {
                searchResults.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-search text-gray-400 text-4xl mb-4"></i>
                        <p class="text-gray-600 text-lg">Nenhuma localidade encontrada para "${searchTerm}"</p>
                        <p class="text-gray-500 text-sm mt-2">Tente usar termos diferentes ou verifique a ortografia.</p>
                    </div>
                `;
            }
            
            // Mostrar modal com resultados
            searchResultsModal.classList.remove('hidden');
            searchResultsModal.classList.add('flex');
        }

        async function saveRoute(routeData) {
            try {
                showLoading(true);
                
                if (editingRouteId) {
                    await updateDoc(doc(db, "rotas", editingRouteId), routeData);
                    console.log("Rota atualizada com sucesso!");
                } else {
                    await addDoc(collection(db, "rotas"), routeData);
                    console.log("Rota adicionada com sucesso!");
                }
                
                await loadRoutes();
                showModal(false);
                clearForm();
            } catch (error) {
                console.error("Erro ao salvar rota:", error);
                alert("Erro ao salvar a rota. Tente novamente.");
            } finally {
                showLoading(false);
            }
        }

        window.editRoute = function(routeId) {
            const route = allRoutes.find(r => r.id === routeId);
            if (route) {
                editingRouteId = routeId;
                document.getElementById('localidade').value = route.localidade;
                document.getElementById('diaSemana').value = route.diaSemana;
                document.getElementById('montagem').value = route.montagem;
                document.getElementById('inverno').value = route.inverno;
                modalTitle.textContent = 'Editar Rota';
                showModal(true);
            }
        };

        function showDeleteModal(show = true) {
            deleteModal.classList.toggle('hidden', !show);
            deleteModal.classList.toggle('flex', show);
        }

        // Função chamada quando o botão de excluir é clicado
        window.deleteRoute = function(routeId) {
            const route = allRoutes.find(r => r.id === routeId);
            if (route) {
                routeToDelete = routeId;
                deleteLocalidade.textContent = route.localidade;
                showDeleteModal(true);
            }
        };

        // Função para confirmar a exclusão
        async function confirmDeleteRoute() {
            if (routeToDelete) {
                try {
                    showLoading(true);
                    showDeleteModal(false);
                    
                    await deleteDoc(doc(db, "rotas", routeToDelete));
                    console.log("Rota excluída com sucesso!");
                    
                    // Recarrega as rotas e atualiza a busca se houver resultados sendo exibidos
                    await loadRoutes();
                    
                    // Se o modal de busca estiver aberto, atualiza os resultados
                    if (!searchResultsModal.classList.contains('hidden')) {
                        searchRoutes();
                    }
                    
                    routeToDelete = null;
                } catch (error) {
                    console.error("Erro ao excluir rota:", error);
                    alert("Erro ao excluir a rota. Tente novamente.");
                } finally {
                    showLoading(false);
                }
            }
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'rotas-zenir-v1';
                    const urlsToCache = [
                        '/',
                        '/index.html',
                        'https://cdn.tailwindcss.com',
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css',
                        'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap'
                    ];

                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(cache => cache.addAll(urlsToCache))
                        );
                    });

                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request)
                                .then(response => {
                                    if (response) {
                                        return response;
                                    }
                                    return fetch(event.request);
                                })
                        );
                    });
                `;
                
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            loadRoutes();
        });

        // Handle dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</body>
    </html>
